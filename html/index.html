<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>520告白❤️</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
<!-- 这里可以修改文字 -->
<section class="container">
    <div class="content">
        <h1 class="title">❤️ 我的心动邀请 ❤️</h1>
        <h2 class="subtitle">在这特别的日子里，我想对你说：遇见你是我最美好的意外</h2>
        <figure class="face-slider">
            <div class="face-slider-blush face-slider-blush-left"></div>
            <div class="face-slider-blush face-slider-blush-right"></div>
            <div class="face-slider-eye face-slider-eye-left"></div>
            <div class="face-slider-eye face-slider-eye-right"></div>
            <div class="face-slider-mouth"></div>
        </figure>
        <button class="button button-happy">💖 我愿意，一起走下去</button>
        <button class="button button-unhappy">😔 再给我点时间</button>
    </div>
    <div class="floating-hearts"></div>
</section>
<script src="script.js"></script>
</body>

</html>
